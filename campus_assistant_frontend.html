<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Regulations Assistant</title>
<style>
:root{--bg:#FFF7E6;--bg2:#FBE6E3;--card:#FFFCF4;--ink:#2D3A47;--mute:#6E7C8A;--line:#EDCFD0;--accent:#B46A72;--accent2:#F7C8D3;--sage:#A8B58A;--sky:#A9B7C6;--warn:#F3E0B0;--warnink:#6B5014;--shadow:0 6px 22px rgba(180,106,114,.18);--serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;--sans:"DM Sans","Segoe UI",system-ui,sans-serif}
:root[data-theme=dark]{--bg:#2D3A47;--bg2:#26323D;--card:#364554;--ink:#F3EBDD;--mute:#A9B7C6;--line:#46586A;--accent:#A9B7C6;--accent2:#6F8499;--sage:#A8B58A;--sky:#A9B7C6;--warn:#4B4430;--warnink:#F3D9A4;--shadow:0 6px 22px rgba(0,0,0,.28)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);transition:background .4s,color .4s;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:fixed;inset:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 28px;z-index:5}
.brand{font:600 22px var(--serif);letter-spacing:.2px}
.sp{flex:1}
.pills{display:flex;gap:6px;background:var(--bg2);padding:4px;border-radius:99px;border:1px solid var(--line)}
.pills button{border:0;background:none;padding:5px 13px;border-radius:99px;font-size:14px;color:var(--mute)}
.pills button[aria-pressed=true]{background:var(--accent);color:#fff}
:root[data-theme=dark] .pills button[aria-pressed=true]{color:#2D3A47}
.icon{border:1px solid var(--line);background:var(--bg2);width:38px;height:38px;border-radius:50%}
.dd{position:relative}
.ddb{border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:6px 16px}
.ddb:hover{border-color:var(--accent)}
.ddl{position:absolute;right:0;top:46px;list-style:none;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:210px;max-height:62vh;overflow:auto;z-index:9}
.ddl button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 12px;border-radius:10px}
.ddl button:hover,.ddl button[aria-selected=true]{background:var(--accent);color:#fff}
:root[data-theme=dark] .ddl button:hover,:root[data-theme=dark] .ddl button[aria-selected=true]{color:#2D3A47}
.view{position:absolute;inset:0;padding:70px 28px 24px;transition:opacity .5s,transform .5s}
.view[hidden]{display:block;opacity:0;pointer-events:none;transform:translateY(14px)}

/* orb */
.orb{--s:190px;width:var(--s);height:var(--s);border-radius:50%;padding:calc(var(--s)*.035);border:1px solid var(--accent);position:relative;flex:none}
.orb .r2{width:100%;height:100%;border-radius:50%;padding:calc(var(--s)*.035);border:1px solid var(--sage)}
.orb .core{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;background:var(--card);box-shadow:var(--shadow)}
.orb img{position:absolute;inset:-8%;width:116%;height:116%;animation:spin 46s linear infinite}
.orb.think img{animation-duration:3.2s}
.orb.think::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid var(--accent);animation:ping 1.15s ease-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.28)}}

/* landing */
#home{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#home h1{font:500 clamp(30px,5vw,48px)/1.1 var(--serif)}
.status{min-height:24px;color:var(--mute);font-size:15px}
.ask{width:min(640px,100%);display:flex;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px 12px 10px 18px;box-shadow:var(--shadow)}
.ask textarea{flex:1;border:0;background:none;resize:none;font:inherit;color:inherit;min-height:52px;outline:0}
.send{border:0;background:var(--accent);color:#fff;border-radius:14px;padding:10px 18px}
:root[data-theme=dark] .send{color:#2D3A47}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:680px}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:6px 14px;font-size:14px;color:var(--mute)}
.chip:hover{border-color:var(--accent);color:var(--ink)}

/* workspace */
#work{display:grid;grid-template-columns:1fr minmax(320px,430px);gap:26px}
#work h2{font:500 30px var(--serif);margin-bottom:12px}
.left{overflow:auto;padding:4px 6px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.src{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);transition:transform .25s,outline-color .25s;outline:2px solid transparent}
.src.on{outline-color:var(--accent);transform:translateY(-4px)}
.src.in{animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.src .hd{height:78px;display:flex;align-items:flex-end;padding:10px 14px;background:linear-gradient(135deg,var(--accent2),var(--sky));font:600 30px var(--serif);color:#2D3A47;position:relative}
.src .hd small{position:absolute;top:10px;left:12px;font:500 12px var(--sans);background:var(--card);color:var(--ink);padding:1px 9px;border-radius:99px}
.src .bd{padding:12px 14px 14px;font-size:14px}
.src .bd b{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:500}
.src.doc .hd{background:linear-gradient(135deg,var(--sage),var(--sky))}
.empty{color:var(--mute);padding:20px;border:1px dashed var(--line);border-radius:20px;grid-column:1/-1}
.right{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:0}
.panel{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:12px}
.panel h3{font:600 20px var(--serif);text-align:center;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px;background:var(--card)}
.feed{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:2px}
.bub{border-radius:16px;padding:10px 14px;font-size:15px;animation:rise .35s both}
.q{align-self:flex-end;background:var(--accent);color:#fff;max-width:88%}
:root[data-theme=dark] .q{color:#2D3A47}
.a{background:var(--card);border:1px solid var(--line)}
.cite{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:99px;padding:0 8px;font-size:12.5px;margin:0 2px}
.cite:hover{background:var(--accent);color:#fff}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.steps span{padding:2px 10px;border-radius:99px;border:1px solid var(--line)}
.steps .cur{border-color:var(--sage);color:var(--ink);background:color-mix(in srgb,var(--sage) 30%,transparent)}
.nc{background:var(--warn);color:var(--warnink);border-radius:16px;padding:12px 14px;font-size:15px}
.nc b{display:block;font:600 18px var(--serif)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.vs div{background:var(--bg2);border-radius:12px;padding:8px 10px;font-size:14px}
.vs b{display:block;color:var(--accent);font-size:13px}
.demo{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
.panel .ask{margin-top:10px;border-radius:16px;padding:6px 8px 6px 12px;box-shadow:none}
.panel .ask textarea{min-height:40px}
@media(max-width:820px){body{overflow:auto}#work{grid-template-columns:1fr;overflow:auto}.right{order:-1}.brand{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const DOC="SSIT Handbook 2025-26";
const BRANCHES=["CSE","CSE(DS)","CSE(AIML)","CSE(Cyber Security)","ISE","ECE","EEE","ME","BME","RAI","CIVIL"];
const EXAMPLES=["What is the minimum attendance for exams?","How do I convert CGPA to percentage?","What are the hostel timings?"];
// Demo data. Replace askBackend() with a fetch to your Gradio/Python API.
const KB={
 att:{keys:/attend/i,title:"Minimum attendance",
  by:{"B.E.":{t:"B.E. students need at least 85% attendance in each course to sit the end-semester exam {{21}}.",s:[[21,"UG Regulations","Minimum 85% attendance is required in every course…"]]}}},
 cgpa:{keys:/cgpa|percent/i,title:"CGPA to percentage",
  by:{"B.E.":{t:"For B.E., percentage = (CGPA − 0.75) × 10 {{18}}.",s:[[18,"UG Regulations","Percentage = (CGPA − 0.75) × 10…"]]}}}
};
const CONTACT={hostel:"Warden, Hostel Office",exam:"Dean (Examination)",def:"Administrative Office"};
const $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
let prog="B.E.", branch="CSE", busy=false, started=false;

function drop(){$("#ddl").innerHTML=BRANCHES.map(b=>`<li><button role="option" aria-selected="${b===branch}" data-b="${b}">${b}</button></li>`).join("");$("#br").textContent=branch}
$("#ddb").onclick=e=>{e.stopPropagation();const l=$("#ddl");l.hidden=!l.hidden;$("#ddb").setAttribute("aria-expanded",!l.hidden)};
$("#ddl").onclick=e=>{const b=e.target.dataset.b;if(b){branch=b;drop();$("#ddl").hidden=true;$("#ddb").setAttribute("aria-expanded","false")}};
document.addEventListener("click",()=>{$("#ddl").hidden=true});
drop();
$("#chips").innerHTML=EXAMPLES.map(x=>`<button class="chip">${x}</button>`).join("");
$("#chips").onclick=e=>{if(e.target.classList.contains("chip"))ask(e.target.textContent)};
$("#theme").onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==="dark"?"light":"dark"};
document.addEventListener("click",e=>{const id=e.target.dataset.send;if(id){ask($("#"+id).value);$("#"+id).value=""}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&e.target.tagName==="TEXTAREA"){e.preventDefault();ask(e.target.value);e.target.value=""}});

// Swap this for a real call, e.g. fetch("/api/ask",{method:"POST",body:JSON.stringify({q,program})})
async function askBackend(q,program,course){
  await sleep(1500);
  const hit=Object.values(KB).find(k=>k.keys.test(q));
  if(hit)return {type:"answer",title:hit.title,items:[{p:program,...hit.by["B.E."]}]};
  const k=/hostel|warden|mess/i.test(q)?"hostel":/re-?eval|revaluation/i.test(q)?"exam":"def";
  return {type:"none",contact:CONTACT[k]};
}

async function ask(q){
  q=q.trim(); if(!q||busy)return; busy=true;
  const orbs=[$("#orb1"),$("#orb2")]; orbs.forEach(o=>o.classList.add("think"));
  if(!started){$("#status1").textContent="Searching the handbook…";await sleep(700);
    $("#home").hidden=true;$("#work").hidden=false;started=true}
  const feed=$("#feed");
  feed.insertAdjacentHTML("beforeend",`<div class="bub q"></div>`);feed.lastChild.textContent=q;
  feed.insertAdjacentHTML("beforeend",`<div class="bub a steps"><span class="cur">Searching handbook</span><span>Reading pages</span><span>Writing answer</span></div>`);
  const st=feed.lastChild; feed.scrollTop=1e9;
  const res=await askBackend(q,prog,branch);
  st.children[0].className="";st.children[1].className="cur";await sleep(500);
  const grid=$("#grid"); grid.innerHTML="";
  if(res.type==="none"){
    grid.innerHTML=`<div class="empty">No passages in the handbook match this question.</div>`;
    st.outerHTML=`<div class="nc bub"><b>Not covered</b>The ${DOC} doesn’t answer this. Please contact the ${res.contact}.</div>`;
  }else{
    grid.insertAdjacentHTML("beforeend",`<div class="src doc in"><div class="hd"><small>PDF</small>${DOC}</div><div class="bd"><b>68 pages</b>Source document</div></div>`);
    let n=0;
    res.items.forEach(it=>it.s.forEach(([pg,sec,txt])=>{grid.insertAdjacentHTML("beforeend",
      `<div class="src in" id="p${pg}" style="animation-delay:${.12*++n}s"><div class="hd"><small>${it.p}</small>p. ${pg}</div><div class="bd"><b>${sec}</b>${txt}</div></div>`)}));
    st.children[1].className="";st.children[2].className="cur";await sleep(500);
    st.outerHTML=`<div class="bub a"></div>`;
    const box=feed.lastChild;
    await stream(box,res.items[0].t);
  }
  orbs.forEach(o=>o.classList.remove("think")); busy=false; feed.scrollTop=1e9;
}
async function stream(box,text){
  let out="";
  for(const w of text.split(" ")){
    out+=(out?" ":"")+w;
    box.innerHTML=out.replace(/\{\{(\d+)\}\}/g,(m,p)=>`<button class="cite" data-pg="${p}">p. ${p}</button>`);
    $("#feed").scrollTop=1e9; await sleep(45);
  }
}
document.addEventListener("click",e=>{const pg=e.target.dataset.pg;if(!pg)return;
  document.querySelectorAll(".src.on").forEach(x=>x.classList.remove("on"));
  const c=document.getElementById("p"+pg);if(c){c.classList.add("on");c.scrollIntoView({behavior:"smooth",block:"center"})}});
</script>
</body>
</html>
